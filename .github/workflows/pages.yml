name: build example pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: generate example pages
        run: |
          mkdir -p _site/exemples
          ./mcdview.py exemples/mediatheque.sql -o _site/exemples/mediatheque.html \
              --titre "Médiathèque (démo)" --fk-audit '_idmodificateur_fk$' --lang en
          ./mcdview.py exemples/pagila.sql -o _site/exemples/pagila.html \
              --titre "Pagila (DVD rental)" --lang en
          ./mcdview.py exemples/northwind.sql -o _site/exemples/northwind.html \
              --titre "Northwind" --lang en
          ./mcdview.py exemples/chinook.sql -o _site/exemples/chinook.html \
              --titre "Chinook (music store)" --lang en
          cp docs/index.html _site/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
