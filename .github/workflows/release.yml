name: release

# Publish to PyPI when a version tag is pushed (e.g. `git tag v0.23.1 && git push --tags`).
# Uses PyPI Trusted Publishing (OIDC): no token is stored anywhere.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: the tag must match the version in pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag pyproject=$proj"
          [ "$tag" = "$proj" ] || { echo "tag v$tag != pyproject $proj"; exit 1; }
      - name: lint + fast tests
        run: |
          pipx install ruff==0.16.8
          python -m py_compile mcdview.py tests/*.py
          ruff check --select F,E9 mcdview.py tests/*.py
          pip install sqlglot==30.18.0
          ./tests/tester.py --rapide
          ./tests/test_parser.py
          ./tests/test_securite.py
          ./tests/test_diff.py
          ./tests/test_export.py

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write        # OIDC token for Trusted Publishing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: build the wheel and sdist
        run: |
          python -m pip install build==1.6.1
          python -m build
      - name: publish to PyPI
        # pinned by commit: this step holds the OIDC token that publishes to PyPI,
        # and release/v1 is a moving branch
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
