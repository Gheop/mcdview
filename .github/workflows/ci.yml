name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The checks run as independent jobs in parallel: most of the old single job's
# time was setup (the postgres service, the npm converters, Chrome), spent one
# after the other. Each job pays only for what its own checks need.
jobs:
  # lint + the Python tests (parser, security, dialects, invariants, diff, export,
  # corpus campaign on the committed examples)
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: lint (real errors only, no style)
        run: |
          pipx install ruff
          python -m py_compile mcdview.py tests/*.py
          ruff check --select F,E9 mcdview.py tests/*.py
      - name: install sqlglot (optional backend for non-PostgreSQL dialects)
        # pinned: a sqlglot release can shift dialect table counts (ATTENDUS),
        # so bump this deliberately rather than let CI drift on every release
        run: pip install sqlglot==30.18.0
      - name: pinned regression (examples; .dbm samples skipped without pgmodeler-cli)
        run: ./tests/tester.py --rapide
      - name: parser edge cases (inline PK, phantom-PK traps)
        run: ./tests/test_parser.py
      - name: security (XSS escaping, ReDoS/DoS budget)
        run: ./tests/test_securite.py
      - name: dialects (MySQL, SQLite via sqlglot)
        run: ./tests/test_dialectes.py
      - name: content invariants (no empty types, phantom PKs, dangling FKs)
        run: ./tests/test_invariants.py --strict
      - name: schema diff (added/removed/changed tagging)
        run: ./tests/test_diff.py
      - name: mermaid export (round-trips to the same tables)
        run: ./tests/test_export.py
      - name: corpus campaign (examples), strict
        run: ./tests/grand_banc.py --strict

  # model files that go through an external converter (DBML, Prisma)
  converters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: install sqlglot (optional backend for non-PostgreSQL dialects)
        run: pip install sqlglot==30.18.0
      - name: install model-file converters (DBML, Prisma)
        run: npm install -g @dbml/cli@10.1.1 prisma@6
      - name: model formats (DBML via dbml2sql)
        run: ./tests/test_modeles.py

  # the --db path, end-to-end against a throwaway PostgreSQL
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: mcdview_test
        ports: ['5432:5432']
        # a short interval: the job waits for the first healthy check, and a
        # 10 s interval left it idle ~14 s; 25 retries keep the same ~50 s window
        options: >-
          --health-cmd pg_isready --health-interval 2s
          --health-timeout 5s --health-retries 25
    env:
      MCDVIEW_TEST_DB: postgresql://postgres:secret@localhost:5432/mcdview_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: live database via --db (against the postgres service)
        # psql/pg_dump 16 ship with the runner image (the apt install only ever
        # added the meta package). test_db.py skips with exit 0 when a client is
        # missing, so this job fails unless the test really read the database.
        run: |
          set -o pipefail
          pg_dump --version && psql --version
          ./tests/test_db.py | tee test_db.log
          grep -q 'schéma live lu via pg_dump' test_db.log

  # the generated pages: build the Pages site, then check it renders in headless
  # Chrome, then the in-browser behaviour tests
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: generate example pages
        run: |
          mkdir -p _site/exemples
          # --no-credit: these are the official mcdview showcase (default
          # branding), so the attribution stamp would just duplicate it
          ./mcdview.py exemples/mediatheque.sql -o _site/exemples/mediatheque.html \
              --titre "Médiathèque (démo)" --fk-audit '_idmodificateur_fk$' --lang en --no-credit
          ./mcdview.py exemples/pagila.sql -o _site/exemples/pagila.html \
              --titre "Pagila (DVD rental)" --lang en --no-credit
          ./mcdview.py exemples/northwind.sql -o _site/exemples/northwind.html \
              --titre "Northwind" --lang en --no-credit
          ./mcdview.py exemples/chinook.sql -o _site/exemples/chinook.html \
              --titre "Chinook (music store)" --lang en --no-credit
          ./mcdview.py exemples/boutique_v2.sql --diff exemples/boutique_v1.sql \
              -o _site/exemples/boutique-diff.html --titre "Shop schema v1 → v2 (diff)" --lang en --no-credit
          cp docs/index.html _site/index.html
      - name: validate generated HTML (structure + data island)
        run: ./tests/valider_html.py _site/exemples/*.html
      - uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: validate rendered DOM in headless Chrome
        run: |
          for p in _site/exemples/*.html; do
            n=$(chrome --headless=new --disable-gpu --no-sandbox \
                  --virtual-time-budget=8000 --dump-dom "file://$PWD/$p" 2>/dev/null \
                | grep -o 'class="table[ "]' | wc -l)
            echo "$p : $n tables rendues"
            [ "$n" -gt 0 ] || { echo "aucune table rendue dans $p"; exit 1; }
          done
      - name: saved positions restore without animating (links never point into space)
        run: ./tests/test_positions.py
      - name: link routing (edge anchoring, self-loop, highlighted-edge overlay)
        run: ./tests/test_liens.py
      - name: detail-panel intro remembered across loads
        run: ./tests/test_panneau.py
      - name: layout undo (drag a table, Ctrl+Z puts it back)
        run: ./tests/test_undo.py
      - name: export HTML with the current layout (clean copy, no bloat)
        run: ./tests/test_export_html.py
      - name: search suggestions list tables before columns
        run: ./tests/test_recherche.py
      - name: crow's-foot cardinalities (toggle, deduced markers, vif labels)
        run: ./tests/test_cardinalites.py
      - name: FK link detail (click a link, panel shows endpoints/cardinality/actions)
        run: ./tests/test_lien_detail.py
      - name: incremental hover and drag (same layers as a full redraw)
        run: ./tests/test_survol.py
      - name: minimap cache never stale (pan, drag, isolate, overview, compact)
        run: ./tests/test_minimap.py
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  # .dbm path, tested in the pinned pgmodeler-cli 1.2.2 image (same version as
  # mcdview-site's production), which carries python3, node (for checkout) and
  # the pgModeler sample models. Blocking: the version is fixed, counts stable.
  test-dbm:
    runs-on: ubuntu-latest
    container: ghcr.io/gheop/pgmodeler-cli:1.2.2-node
    steps:
      - uses: actions/checkout@v7
      - name: regression including .dbm samples
        run: ./tests/tester.py --rapide

  deploy:
    needs: [unit, converters, db, browser]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # only the Pages deployment needs to write Pages and mint an OIDC token
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
