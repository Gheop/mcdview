name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: lint (real errors only, no style)
        run: |
          pipx install ruff
          python -m py_compile mcdview.py tests/*.py
          ruff check --select F,E9 mcdview.py tests/*.py
      - name: pinned regression (examples; .dbm samples skipped without pgmodeler-cli)
        run: ./tests/tester.py --rapide
      - name: security (XSS escaping, ReDoS/DoS budget)
        run: ./tests/test_securite.py
      - name: corpus campaign (examples), strict
        run: ./tests/grand_banc.py --strict
      - name: generate example pages
        run: |
          mkdir -p _site/exemples
          ./mcdview.py exemples/mediatheque.sql -o _site/exemples/mediatheque.html \
              --titre "Médiathèque (démo)" --fk-audit '_idmodificateur_fk$' --lang en
          ./mcdview.py exemples/pagila.sql -o _site/exemples/pagila.html \
              --titre "Pagila (DVD rental)" --lang en
          ./mcdview.py exemples/northwind.sql -o _site/exemples/northwind.html \
              --titre "Northwind" --lang en
          ./mcdview.py exemples/chinook.sql -o _site/exemples/chinook.html \
              --titre "Chinook (music store)" --lang en
          cp docs/index.html _site/index.html
      - name: validate generated HTML (structure + data island)
        run: ./tests/valider_html.py _site/exemples/*.html
      - uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: validate rendered DOM in headless Chrome
        run: |
          for p in _site/exemples/*.html; do
            n=$(chrome --headless=new --disable-gpu --no-sandbox \
                  --virtual-time-budget=8000 --dump-dom "file://$PWD/$p" 2>/dev/null \
                | grep -o 'class="table[ "]' | wc -l)
            echo "$p : $n tables rendues"
            [ "$n" -gt 0 ] || { echo "aucune table rendue dans $p"; exit 1; }
          done
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  # .dbm path needs pgmodeler-cli, which isn't reliably packaged on the runner:
  # best-effort, never blocks a PR. Local pre-commit covers .dbm for real.
  test-dbm:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: install pgmodeler (best-effort)
        run: sudo apt-get update && sudo apt-get install -y pgmodeler
      - name: regression including .dbm samples
        run: ./tests/tester.py --rapide

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
