<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" class="logomcd">
  <title>mcdview</title>
  <!-- Official animated logo: a magnifier inspecting two linked tables. A packet
       circulates along the FK (SMIL); hovering the logo makes the tables "focus"
       (a slight zoom, clipped to the glass). Declarative only (no script),
       self-contained. The class is scoped (.logomcd) so the inlined <style> does
       not affect the diagram's own <svg> layers. Honors prefers-reduced-motion:
       the packet is hidden and the hover zoom is disabled. -->
  <style>
    .logomcd .lg-tables { transition: transform .25s ease; transform-box: view-box; transform-origin: 56px 56px; }
    .logomcd:hover .lg-tables { transform: scale(1.06); }
    .logomcd .eclat { animation: lg-sweep 3.2s ease-in-out infinite; }
    @keyframes lg-sweep { 0% { transform: translateX(-46px); } 55%, 100% { transform: translateX(150px); } }
    @media (prefers-reduced-motion: reduce) {
      .logomcd .flux { display: none; }
      .logomcd .eclat { animation: none; }
      .logomcd .lg-tables { transition: none; }
      .logomcd:hover .lg-tables { transform: none; }
    }
  </style>
  <defs>
    <linearGradient id="verre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <clipPath id="verre-clip"><circle cx="56" cy="56" r="35"/></clipPath>
  </defs>
  <g opacity=".35">
    <rect x="8" y="14" width="30" height="20" rx="3" fill="#94a3b8"/>
    <rect x="8" y="14" width="30" height="7" rx="3" fill="#64748b"/>
    <rect x="92" y="88" width="28" height="18" rx="3" fill="#94a3b8"/>
    <rect x="92" y="88" width="28" height="6" rx="3" fill="#64748b"/>
    <path d="M38 24l18 20M92 96 76 78" stroke="#94a3b8" stroke-width="2.5" fill="none"/>
  </g>
  <circle cx="56" cy="56" r="38" fill="url(#verre)" stroke="#1d4ed8" stroke-width="7"/>
  <rect x="84" y="88" width="34" height="13" rx="6.5" transform="rotate(45 84 88)" fill="#1d4ed8"/>
  <g class="lg-tables" clip-path="url(#verre-clip)">
    <rect x="34" y="36" width="26" height="18" rx="2.5" fill="#fff" stroke="#1e40af" stroke-width="2"/>
    <rect x="34" y="36" width="26" height="6" rx="2.5" fill="#3b82f6"/>
    <path stroke="#93c5fd" stroke-width="2" d="M38 46h18"/>
    <path stroke="#93c5fd" stroke-width="2" d="M38 50h14"/>
    <rect x="52" y="62" width="26" height="18" rx="2.5" fill="#fff" stroke="#1e40af" stroke-width="2"/>
    <rect x="52" y="62" width="26" height="6" rx="2.5" fill="#3b82f6"/>
    <path stroke="#93c5fd" stroke-width="2" d="M56 72h18"/>
    <path stroke="#93c5fd" stroke-width="2" d="M56 76h14"/>
    <path d="M47 54c0 6 5 4 9 8" stroke="#1d4ed8" stroke-width="2.5" fill="none"/>
    <circle class="flux" r="3" fill="#1d4ed8">
      <animateMotion dur="4s" repeatCount="indefinite" rotate="auto" path="M47 54c0 6 5 4 9 8"/>
    </circle>
  </g>
  <!-- glint sweeping across the glass (clip = upright lens; inner group tilts the strip) -->
  <g clip-path="url(#verre-clip)">
    <g transform="rotate(18 56 56)">
      <rect class="eclat" x="20" y="-10" width="14" height="150" fill="#fff" opacity=".5"/>
    </g>
  </g>
</svg>
