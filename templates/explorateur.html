<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITRE__ — mcdview</title>
<style>
  :root { color-scheme: light dark;
    --fond: #f4f4f6; --encre: #1c1e22; --panneau: #ffffff; --bord: #d5d8dd;
    --ligne: #9aa3ad; --ligne-vive: #0b74c4; --voile: #ffffffcc; }
  @media (prefers-color-scheme: dark) { :root {
    --fond: #1e2126; --encre: #e8eaed; --panneau: #262a30; --bord: #3a3f47;
    --ligne: #566070; --ligne-vive: #4aa8e8; --voile: #1e2126cc; } }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: var(--fond); color: var(--encre);
    font-family: system-ui, sans-serif; font-size: 14px; }
  #viewport { position: absolute; inset: 0; right: 340px; cursor: grab; touch-action: none;
    user-select: none; -webkit-user-select: none; }
  #viewport.drag { cursor: grabbing; }
  #plan { position: absolute; transform-origin: 0 0; }
  #liens { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .table { position: absolute; min-width: 150px; background: var(--panneau);
    border: 1.5px solid var(--bord); border-radius: 6px; cursor: pointer;
    box-shadow: 0 1px 4px #0002; transition: left .35s ease, top .35s ease, opacity .25s; }
  .table.choisie { border-color: var(--ligne-vive); border-width: 2.5px;
    box-shadow: 0 2px 12px #0b74c455; }
  .table.efface { opacity: 0; pointer-events: none; }
  .table.deplace { transition: none; cursor: grabbing; }
  .table h3 { margin: 0; padding: 4px 10px; font-size: 13px; color: #1c1e22;
    border-radius: 4px 4px 0 0; white-space: nowrap; }
  .table ul { margin: 0; padding: 3px 10px 5px; list-style: none; }
  .table li { white-space: nowrap; line-height: 1.45; color: var(--encre); }
  .table li .t { opacity: .55; font-size: 12px; margin-left: 6px; }
  #hud { position: fixed; top: 12px; left: 12px; display: flex; gap: 8px;
    align-items: center; background: var(--voile); backdrop-filter: blur(4px);
    padding: 7px 12px; border-radius: 8px; z-index: 10; border: 1px solid var(--bord); }
  #hud input[type=search] { padding: 4px 8px; border: 1px solid var(--bord);
    border-radius: 5px; background: var(--panneau); color: var(--encre); width: 200px; }
  #hud button { padding: 4px 10px; border: 1px solid var(--bord); border-radius: 5px;
    background: var(--panneau); color: var(--encre); cursor: pointer; }
  #hud label { display: flex; gap: 4px; align-items: center; font-size: 13px; }
  #compte { font-size: 12px; opacity: .55; white-space: nowrap; }
  .table:hover { border-color: var(--ligne-vive); }
  #panneau { position: absolute; top: 0; right: 0; bottom: 0; width: 340px;
    background: var(--panneau); border-left: 1px solid var(--bord);
    overflow-y: auto; padding: 14px 16px; box-sizing: border-box; }
  #panneau h2 { margin: 0 0 2px; font-size: 17px; }
  #panneau .schema { font-size: 12px; opacity: .7; margin-bottom: 8px; }
  #panneau .comm { font-style: italic; opacity: .8; margin: 6px 0 10px; }
  #panneau table { border-collapse: collapse; width: 100%; font-size: 13px; }
  #panneau td { padding: 3px 6px 3px 0; vertical-align: top; border-top: 1px solid var(--bord); }
  #panneau .ic { width: 22px; }
  #panneau .ty { opacity: .6; font-size: 12px; }
  #panneau .ccom { font-size: 11.5px; opacity: .65; font-style: italic; }
  #panneau a { color: var(--ligne-vive); cursor: pointer; text-decoration: none; }
  #panneau h4 { margin: 14px 0 4px; font-size: 13px; text-transform: uppercase;
    letter-spacing: .04em; opacity: .7; }
  #panneau .vide { opacity: .6; font-style: italic; margin-top: 3em; }
  #legende { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 6px;
    flex-wrap: wrap; z-index: 10; max-width: 55%; }
  #legende .puce { display: flex; gap: 6px; align-items: center; font: inherit;
    background: var(--voile); color: var(--encre); border: 1px solid var(--bord);
    border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer;
    backdrop-filter: blur(4px); }
  #legende .puce .pt { width: 10px; height: 10px; border-radius: 50%;
    border: 1px solid #0002; }
  #legende .puce .nb { opacity: .6; }
  path.lien { stroke: var(--ligne); stroke-width: 1.2; fill: none; opacity: .5; }
  path.lien.vif { stroke: var(--ligne-vive); stroke-width: 2; opacity: 1; }
</style>
</head>
<body>
<div id="hud">
  <span style='display:flex;align-items:center'>__LOGO__</span>
  <strong>__TITRE__</strong>
  <input id="cherche" type="search" placeholder="chercher une table…" list="noms">
  <datalist id="noms"></datalist>
  <button id="vueGenerale" hidden>← vue générale (Échap)</button>
  <label id="labelAudit"><input type="checkbox" id="voirAudit"> FK d'audit</label>
  <span id="compte"></span>
</div>
<div id="viewport">
  <div id="plan"><svg id="liens"></svg></div>
</div>
<div id="legende"></div>
<div id="panneau"><p class="vide">Cliquer sur une table pour l'isoler avec ses
tables liées et voir son détail ici.<br><br>Molette : zoom.
Glisser : déplacer. Échap : vue générale.</p></div>
<script>
"use strict";
const D = __DONNEES__;
const plan = document.getElementById("plan");
const vp = document.getElementById("viewport");
const svg = document.getElementById("liens");
const panneau = document.getElementById("panneau");
const btnRetour = document.getElementById("vueGenerale");
const ckAudit = document.getElementById("voirAudit");
const parCle = {}, elems = {}, origines = {};
let focusCle = null, survolCle = null, x = 0, y = 0, k = 1;

D.tables.forEach(t => { parCle[t.schema + "." + t.nom] = t; });

// injected model strings (names, types, comments) must never become markup
function ech(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
document.getElementById("compte").textContent =
  D.tables.length + " tables · " + D.fks.length + " FK";

function fksVisibles() {
  return D.fks.filter(f => ckAudit.checked || !f.audit);
}
function voisins(cle) {
  const s = new Set();
  fksVisibles().forEach(f => {
    if (f.de === cle) s.add(f.vers);
    if (f.vers === cle) s.add(f.de);
  });
  s.delete(cle);
  return [...s];
}

// --- table construction ---
const dl = document.getElementById("noms");
// single fragment append: one layout instead of thousands on big models
const fragTables = document.createDocumentFragment();
const fragNoms = document.createDocumentFragment();
const fkColsPar = {};
D.fks.forEach(f => { (fkColsPar[f.de] = fkColsPar[f.de] || new Set()).add(f.col); });
D.tables.forEach(t => {
  const cle = t.schema + "." + t.nom;
  const div = document.createElement("div");
  div.className = "table";
  div.style.left = t.x + "px";
  div.style.top = t.y + "px";
  const fkCols = fkColsPar[cle] || new Set();
  div.innerHTML = "<h3 style='background:" + (D.schemas[t.schema] || "#ccc") + "'>" +
    ech(t.nom) + "</h3><ul>" +
    t.cols.map(c => "<li>" + (t.pk.includes(c.nom) ? "🔑 " : fkCols.has(c.nom) ? "🔗 " : "") +
      ech(c.nom) + "<span class='t'>" + ech(c.type) + "</span></li>").join("") + "</ul>";
  if (t.comment) div.title = t.comment;
  div.dataset.cle = cle;
  fragTables.appendChild(div);
  elems[cle] = div;
  const o = document.createElement("option");
  o.value = cle;
  fragNoms.appendChild(o);
});
plan.appendChild(fragTables);
dl.appendChild(fragNoms);
Object.keys(elems).forEach(cle => {
  origines[cle] = { x: elems[cle].offsetLeft, y: elems[cle].offsetTop };
});

// --- schema legend: one chip per schema, click to frame its zone ---
const legende = document.getElementById("legende");
const parSchema = {};
D.tables.forEach(t => { (parSchema[t.schema] = parSchema[t.schema] || []).push(t.schema + "." + t.nom); });
if (Object.keys(parSchema).length > 1) {
  Object.keys(parSchema).sort().forEach(s => {
    const puce = document.createElement("button");
    puce.className = "puce";
    puce.title = "cadrer ce schéma";
    puce.innerHTML = `<span class="pt" style="background:${ech(D.schemas[s] || "#ccc")}"></span>` +
      `${ech(s)} <span class="nb">${parSchema[s].length}</span>`;
    puce.addEventListener("click", () => {
      vueGenerale();
      setTimeout(() => cadrer(parSchema[s]), 400);
    });
    legende.appendChild(puce);
  });
}

// --- SVG links ---
function centre(cle) {
  const e = elems[cle];
  return { x: e.offsetLeft + e.offsetWidth / 2, y: e.offsetTop + e.offsetHeight / 2,
           w: e.offsetWidth, h: e.offsetHeight };
}
function dessinerLiens() {
  // built as one markup string: thousands of paths in a single DOM write
  const visibles = new Set(Object.keys(elems).filter(c => !elems[c].classList.contains("efface")));
  const morceaux = [];
  fksVisibles().forEach(f => {
    if (!visibles.has(f.de) || !visibles.has(f.vers)) return;
    const a = centre(f.de), b = centre(f.vers);
    const mx = (a.x + b.x) / 2;
    const vif = ((focusCle && (f.de === focusCle || f.vers === focusCle)) ||
                 (survolCle && (f.de === survolCle || f.vers === survolCle))) ? " vif" : "";
    morceaux.push(`<path class="lien${vif}" d="M ${a.x} ${a.y} C ${mx} ${a.y}, ` +
      `${mx} ${b.y}, ${b.x} ${b.y}"/>`);
  });
  svg.innerHTML = morceaux.join("");
}

// --- hover: light up the links of the table under the pointer ---
plan.addEventListener("mouseover", e => {
  const t = e.target.closest(".table");
  const cle = t ? t.dataset.cle : null;
  if (cle !== survolCle) { survolCle = cle; dessinerLiens(); }
});
plan.addEventListener("mouseleave", () => {
  if (survolCle) { survolCle = null; dessinerLiens(); }
});

// --- pan / zoom ---
function rendre() { plan.style.transform = `translate(${x}px, ${y}px) scale(${k})`; }
function cadrer(cles) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  cles.forEach(c => {
    const e = elems[c];
    x0 = Math.min(x0, e.offsetLeft); y0 = Math.min(y0, e.offsetTop);
    x1 = Math.max(x1, e.offsetLeft + e.offsetWidth);
    y1 = Math.max(y1, e.offsetTop + e.offsetHeight);
  });
  const marge = 60;
  k = Math.min(vp.clientWidth / (x1 - x0 + 2 * marge), vp.clientHeight / (y1 - y0 + 2 * marge), 1.4);
  x = (vp.clientWidth - (x1 - x0) * k) / 2 - x0 * k;
  y = (vp.clientHeight - (y1 - y0) * k) / 2 - y0 * k;
  rendre();
}
vp.addEventListener("wheel", e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.15 : 1 / 1.15;
  const nk = Math.min(4, Math.max(0.03, k * f));
  x = e.clientX - (e.clientX - x) * (nk / k);
  y = e.clientY - (e.clientY - y) * (nk / k);
  k = nk;
  rendre();
}, { passive: false });
let drag = null, lienPrevus = false;
function liensAuProchainRendu() {
  // one link redraw per frame while a table is being dragged
  if (lienPrevus) return;
  lienPrevus = true;
  requestAnimationFrame(() => { lienPrevus = false; dessinerLiens(); });
}
vp.addEventListener("pointerdown", e => {
  const table = e.target.closest(".table");
  drag = { px: e.clientX, py: e.clientY, ox: x, oy: y, bouge: false,
           table, tx: table ? table.offsetLeft : 0, ty: table ? table.offsetTop : 0 };
  if (table) table.classList.add("deplace");
  else vp.classList.add("drag");
  vp.setPointerCapture(e.pointerId);
});
vp.addEventListener("pointermove", e => {
  if (!drag) return;
  if (Math.abs(e.clientX - drag.px) + Math.abs(e.clientY - drag.py) > 3) drag.bouge = true;
  if (!drag.bouge) return;
  if (drag.table) {
    // pointer deltas are in screen pixels, the plan is scaled by k
    drag.table.style.left = Math.round(drag.tx + (e.clientX - drag.px) / k) + "px";
    drag.table.style.top = Math.round(drag.ty + (e.clientY - drag.py) / k) + "px";
    liensAuProchainRendu();
  } else {
    x = drag.ox + e.clientX - drag.px;
    y = drag.oy + e.clientY - drag.py;
    rendre();
  }
});
vp.addEventListener("pointerup", e => {
  const fini = drag;
  drag = null;
  vp.classList.remove("drag");
  if (!fini) return;
  if (fini.table) {
    fini.table.classList.remove("deplace");
    if (fini.bouge && !focusCle) {
      // moved in the overview: the new position becomes the home position
      const cle = fini.table.dataset.cle;
      origines[cle] = { x: fini.table.offsetLeft, y: fini.table.offsetTop };
    }
  }
  if (!fini.bouge) {
    const cible = document.elementFromPoint(e.clientX, e.clientY)?.closest(".table");
    if (cible) isoler(cible.dataset.cle);
  }
});

// --- DBeaver-like focus mode: the table in the center, its neighbours in a star ---
function isoler(cle) {
  focusCle = cle;
  survolCle = null;
  history.replaceState(null, "", "#" + encodeURIComponent(cle));
  btnRetour.hidden = false;
  const voisinage = voisins(cle);
  const garde = new Set([cle, ...voisinage]);
  Object.keys(elems).forEach(c => elems[c].classList.toggle("efface", !garde.has(c)));
  Object.keys(elems).forEach(c => elems[c].classList.toggle("choisie", c === cle));
  // star: the chosen table keeps its place, neighbours circle around it
  const c0 = centre(cle);
  const rayon = Math.max(360, 120 + voisinage.length * 42);
  voisinage.forEach((v, i) => {
    const a = -Math.PI / 2 + (2 * Math.PI * i) / voisinage.length;
    const e = elems[v];
    e.style.left = Math.round(c0.x + rayon * Math.cos(a) * 1.45 - e.offsetWidth / 2) + "px";
    e.style.top = Math.round(c0.y + rayon * Math.sin(a) - e.offsetHeight / 2) + "px";
  });
  detailler(cle);
  setTimeout(() => { dessinerLiens(); cadrer([...garde]); }, 380);
  svg.innerHTML = "";
}
function vueGenerale() {
  focusCle = null;
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  btnRetour.hidden = true;
  Object.keys(elems).forEach(c => {
    elems[c].classList.remove("efface", "choisie");
    elems[c].style.left = origines[c].x + "px";
    elems[c].style.top = origines[c].y + "px";
  });
  setTimeout(() => { dessinerLiens(); cadrer(Object.keys(elems)); }, 380);
  svg.innerHTML = "";
}
btnRetour.addEventListener("click", vueGenerale);
document.addEventListener("keydown", e => { if (e.key === "Escape") vueGenerale(); });
vp.addEventListener("dblclick", () => { vueGenerale(); cadrer(Object.keys(elems)); });

// --- detail panel ---
function lienTable(cle) {
  return `<a data-cible="${ech(cle)}">${ech(cle.split(".")[1])}</a>`;
}
function detailler(cle) {
  const t = parCle[cle];
  const sortants = fksVisibles().filter(f => f.de === cle);
  const entrants = fksVisibles().filter(f => f.vers === cle);
  const fkDe = {};
  sortants.forEach(f => { fkDe[f.col] = f.vers; });
  panneau.innerHTML =
    `<h2>${ech(t.nom)}</h2><div class="schema">schéma ${ech(t.schema)}</div>` +
    (t.comment ? `<div class="comm">${ech(t.comment)}</div>` : "") +
    `<table>` + t.cols.map(c => {
      const ic = t.pk.includes(c.nom) ? "🔑" : fkDe[c.nom] ? "🔗" : "";
      const cible = fkDe[c.nom] ? ` → ${lienTable(fkDe[c.nom])}` : "";
      const com = t.colcomments[c.nom] ? `<div class="ccom">${ech(t.colcomments[c.nom])}</div>` : "";
      const def = c.defaut ? `<div class="ccom">= ${ech(c.defaut)}</div>` : "";
      return `<tr><td class="ic">${ic}</td><td><strong>${ech(c.nom)}</strong>${cible}${com}${def}</td>` +
        `<td class="ty">${ech(c.type)}${c.nn ? " NN" : ""}</td></tr>`;
    }).join("") + `</table>` +
    `<h4>Référencée par</h4>` +
    (entrants.length
      ? entrants.map(f => `${lienTable(f.de)} <span class="ty">(${f.col})</span>`).join("<br>")
      : "<span class='ty'>aucune table</span>");
  panneau.querySelectorAll("a[data-cible]").forEach(a =>
    a.addEventListener("click", () => isoler(a.dataset.cible)));
}

// --- search ---
document.getElementById("cherche").addEventListener("change", e => {
  const v = e.target.value.trim();
  const cle = parCle[v] ? v :
    Object.keys(parCle).find(c => c.endsWith("." + v)) ||
    Object.keys(parCle).find(c => c.includes(v));
  if (cle) { vueGenerale(); setTimeout(() => isoler(cle), 400); }
});
ckAudit.addEventListener("change", () => {
  if (focusCle) isoler(focusCle); else dessinerLiens();
});

if (!D.fks.some(f => f.audit)) document.getElementById("labelAudit").hidden = true;
dessinerLiens();
cadrer(Object.keys(elems));

// --- permalink: #schema.table opens straight on that table ---
window.addEventListener("hashchange", () => {
  const cle = decodeURIComponent(location.hash.slice(1));
  if (parCle[cle] && cle !== focusCle) isoler(cle);
  else if (!cle && focusCle) vueGenerale();
});
const cleInitiale = decodeURIComponent(location.hash.slice(1));
if (parCle[cleInitiale]) setTimeout(() => isoler(cleInitiale), 60);
</script>
</body>
</html>
