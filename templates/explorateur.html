<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITRE__ — mcdview</title>
<style>
  :root { color-scheme: light dark;
    --fond: #f4f4f6; --encre: #1c1e22; --panneau: #ffffff; --bord: #d5d8dd;
    --ligne: #9aa3ad; --ligne-vive: #0b74c4; --voile: #ffffffcc; }
  /* dark palette: from prefers-color-scheme when the viewer has not chosen,
     and from an explicit data-theme="dark" (the toggle) which always wins */
  @media (prefers-color-scheme: dark) { :root:not([data-theme]) {
    --fond: #1e2126; --encre: #e8eaed; --panneau: #262a30; --bord: #3a3f47;
    --ligne: #566070; --ligne-vive: #4aa8e8; --voile: #1e2126cc; } }
  :root[data-theme="dark"] {
    --fond: #1e2126; --encre: #e8eaed; --panneau: #262a30; --bord: #3a3f47;
    --ligne: #566070; --ligne-vive: #4aa8e8; --voile: #1e2126cc; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: var(--fond); color: var(--encre);
    font-family: system-ui, sans-serif; font-size: 14px; }
  #viewport { position: absolute; inset: 0; right: 340px; cursor: grab; touch-action: none;
    user-select: none; -webkit-user-select: none; overflow: hidden;
    /* soft fade at the frame edges: a FK link to an off-screen table then fades
       out at the border instead of stopping hard in mid-air ("leads to nothing") */
    -webkit-mask:
      linear-gradient(to right, transparent, #000 26px, #000 calc(100% - 26px), transparent),
      linear-gradient(to bottom, transparent, #000 26px, #000 calc(100% - 26px), transparent);
    -webkit-mask-composite: source-in;
    mask:
      linear-gradient(to right, transparent, #000 26px, #000 calc(100% - 26px), transparent),
      linear-gradient(to bottom, transparent, #000 26px, #000 calc(100% - 26px), transparent);
    mask-composite: intersect; }
  #viewport.drag { cursor: grabbing; }
  #plan { position: absolute; transform-origin: 0 0; }
  #liens { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none;
           transition: opacity .12s ease; }
  /* hidden until the initial refit routes the edges against settled boxes, so
     Firefox never flashes the provisional (mis-placed) edges — revealed with a
     short fade. Tables stay visible throughout (no cold-start blank screen). */
  #liens.avant-refit { opacity: 0; transition: none; }
  .table { position: absolute; min-width: 150px; background: var(--panneau);
    border: 1.5px solid var(--bord); border-radius: 6px; cursor: pointer;
    box-shadow: 0 1px 4px #0002; transition: left .35s ease, top .35s ease, opacity .25s; }
  .table.choisie { border-color: var(--ligne-vive); border-width: 2.5px;
    box-shadow: 0 2px 12px #0b74c455; }
  .table.efface { opacity: 0; pointer-events: none; }
  .table.deplace { transition: none; cursor: grabbing; }
  /* restoring saved positions must be instant, never an animated slide from the
     auto-placement spot (the initial links would be drawn against the moving box
     and point into space until a redraw); see restaurerPositions */
  #plan.instant .table { transition: none; }
  .table h3 { margin: 0; padding: 4px 10px; font-size: 13px; color: #1c1e22;
    border-radius: 4px 4px 0 0; white-space: nowrap; }
  .table ul { margin: 0; padding: 3px 10px 5px; list-style: none; }
  .table li { white-space: nowrap; line-height: 1.45; color: var(--encre); }
  .table li .t { opacity: .55; font-size: 12px; margin-left: 6px; }
  /* level-of-detail: zoomed far out, show table names only (see rendre()) */
  #plan.compact .table ul { display: none; }
  #plan.compact .table h3 { border-radius: 5px; }
  /* schema diff coloring: only --diff pages carry these classes */
  .table.d-add { box-shadow: 0 0 0 2px #22c55e, 0 1px 4px #0002; }
  .table.d-mod { box-shadow: 0 0 0 2px #f59e0b, 0 1px 4px #0002; }
  .table.d-del { box-shadow: 0 0 0 2px #ef4444, 0 1px 4px #0002; opacity: .6; }
  .table li.d-add { background: #22c55e2e; }
  .table li.d-mod { background: #f59e0b2e; }
  .table li.d-del { background: #ef44442e; text-decoration: line-through; }
  .lien.d-add { stroke: #22c55e; }
  .lien.d-del { stroke: #ef4444; stroke-dasharray: 5 4; }
  #panneau tr.d-add td { background: #22c55e2e; }
  #panneau tr.d-mod td { background: #f59e0b2e; }
  #panneau tr.d-del td.ty, #panneau tr.d-del td strong { text-decoration: line-through; }
  #panneau tr.d-del td { background: #ef44442e; }
  #panneau .was { text-decoration: line-through; opacity: .6; }
  #panneau .ixrow { padding: 1px 4px; border-radius: 3px; }
  #panneau .ixrow.d-add { background: #22c55e2e; }
  #panneau .ixrow.d-del { background: #ef444e2e; text-decoration: line-through; }
  #panneau .ixrow.d-mod { background: #f59e0b2e; }
  #panneau tr.cible td:first-child { border-left: 3px solid var(--ligne-vive); }
  /* ---- graph analysis: highlight a set of tables, dim the rest, and light up
     the FK edges inside the set (cycles, impact, join path) ---- */
  body.graphe-actif .table:not(.mev) { opacity: .18; }
  body.graphe-actif .table.mev { box-shadow: 0 2px 14px #0b74c455; }
  .table.mev > h3 { box-shadow: inset 0 0 0 2px var(--ligne-vive); }
  .table.depart > h3 { box-shadow: inset 0 0 0 2px #16a34a; }   /* join path: from */
  .table.arrivee > h3 { box-shadow: inset 0 0 0 2px #dc2626; }  /* join path: to */
  /* hub heatmap: a per-table --deg (0..1, set in JS) shades a red glow by degree */
  body.hubs .table { box-shadow: 0 0 0 calc(var(--deg,0) * 5px)
    rgba(224,74,58, calc(.1 + var(--deg,0) * .5)), 0 1px 4px #0002; }
  .table .deg { display: none; margin-left: 6px; font-size: 11px; font-weight: 700; opacity: .7; }
  body.hubs .table .deg { display: inline; }
  #hud button.actif { border-color: var(--ligne-vive); color: var(--ligne-vive); font-weight: 600; }
  /* export dropdown (native <details>): SVG / Markdown / DOT under one button */
  #hud details.menu { position: relative; }
  #hud details.menu > summary { list-style: none; cursor: pointer; padding: 4px 10px;
    border: 1px solid var(--bord); border-radius: 5px; background: var(--panneau);
    color: var(--encre); }
  #hud details.menu > summary::-webkit-details-marker { display: none; }
  #hud details.menu[open] > summary { border-color: var(--ligne-vive); color: var(--ligne-vive); }
  #hud .menu-liste { position: absolute; top: calc(100% + 4px); left: 0; z-index: 12;
    background: var(--panneau); border: 1px solid var(--bord); border-radius: 6px;
    box-shadow: 0 2px 10px #0003; padding: 4px; display: flex; flex-direction: column;
    gap: 2px; min-width: 150px; }
  #hud .menu-liste button { border: none; background: none; color: var(--encre);
    text-align: left; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
  #hud .menu-liste button:hover { background: var(--voile); }
  #panneau .encart { margin: 10px 0; padding: 8px 10px; background: var(--fond);
    border: 1px solid var(--bord); border-radius: 6px; font-size: 12.5px; }
  #panneau .encart pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-word;
    font-size: 11.5px; font-family: ui-monospace, monospace; }
  #panneau .actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
  #panneau .actions button { padding: 3px 8px; border: 1px solid var(--bord);
    border-radius: 5px; background: var(--panneau); color: var(--encre); cursor: pointer;
    font-size: 12px; }
  #indice { position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
    background: var(--ligne-vive); color: #fff; padding: 5px 14px; border-radius: 6px;
    font-size: 13px; z-index: 12; box-shadow: 0 2px 8px #0004; }
  #indice[hidden] { display: none; }
  /* print / PDF: drop the interactive chrome, flatten the layout to flow, and
     print on white — a snapshot of the diagram and whatever the panel shows */
  @media print {
    #hud, #minimap, #togglePanneau, #indice, #legdiff, #credit, #version { display: none !important; }
    html, body { overflow: visible; height: auto; background: #fff; color: #000; }
    #viewport { position: static; inset: auto; right: auto; overflow: visible;
      -webkit-mask: none; mask: none; }
    #panneau { position: static; width: auto; border: none; transform: none; }
    body.panneau-reduit #panneau { transform: none; }
    .table { box-shadow: none; }
  }
  #legdiff { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    display: none; gap: 14px; align-items: center; background: var(--voile);
    backdrop-filter: blur(4px); padding: 6px 14px; border-radius: 8px; z-index: 10;
    border: 1px solid var(--bord); font-size: 12px; color: var(--encre); }
  #legdiff.on { display: flex; }
  #legdiff span::before { content: ""; display: inline-block; width: 11px; height: 11px;
    border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  #minimap { position: fixed; right: 12px; bottom: 12px; z-index: 9; display: none;
    background: var(--voile); border: 1px solid var(--bord); border-radius: 6px;
    cursor: pointer; backdrop-filter: blur(4px); }
  #minimap.on { display: block; }
  #legdiff .add::before { background: #22c55e; }
  #legdiff .mod::before { background: #f59e0b; }
  #legdiff .del::before { background: #ef4444; }
  #legdiff b { margin-left: 4px; }
  #legdiff button { margin-left: 6px; padding: 2px 10px; border: 1px solid var(--bord);
    border-radius: 12px; background: var(--panneau); color: var(--encre); cursor: pointer;
    font-size: 12px; }
  #legdiff button.actif { background: var(--ligne-vive); color: #fff; border-color: var(--ligne-vive); }
  #hud { position: fixed; top: 12px; left: 12px; display: flex; gap: 8px;
    align-items: center; background: var(--voile); backdrop-filter: blur(4px);
    padding: 7px 12px; border-radius: 8px; z-index: 10; border: 1px solid var(--bord);
    flex-wrap: wrap; max-width: calc(100vw - 372px); }
  #hud input[type=search] { padding: 4px 8px; border: 1px solid var(--bord);
    border-radius: 5px; background: var(--panneau); color: var(--encre); width: 200px; }
  #hud button { padding: 4px 10px; border: 1px solid var(--bord); border-radius: 5px;
    background: var(--panneau); color: var(--encre); cursor: pointer; }
  #hud label { display: flex; gap: 4px; align-items: center; font-size: 13px; }
  #compte { font-size: 12px; opacity: .55; white-space: nowrap; }
  .table:hover { border-color: var(--ligne-vive); }
  #panneau { position: absolute; top: 0; right: 0; bottom: 0; width: 340px;
    background: var(--panneau); border-left: 1px solid var(--bord);
    overflow-y: auto; padding: 14px 16px; box-sizing: border-box;
    transition: transform .25s ease; }
  /* collapsed: the panel slides out and the diagram reclaims the width */
  #viewport, #panneau { transition: right .25s ease, transform .25s ease; }
  body.panneau-reduit #viewport { right: 0; }
  body.panneau-reduit #panneau { transform: translateX(100%); }
  /* intro: the panel shows open over the (already full-width) diagram, then
     slides away — so a first-time viewer sees the panel exists before it tucks */
  body.intro-panneau #panneau { transform: none; }
  body.intro-ferme #panneau { transition: transform 1.8s ease; }
  /* the toggle sits on the panel's inner edge, and rides to the screen edge
     when collapsed so it stays reachable */
  #togglePanneau { position: absolute; top: 50%; right: 340px; z-index: 11;
    transform: translateY(-50%); width: 20px; height: 46px; padding: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    border: 1px solid var(--bord); border-right: none; border-radius: 6px 0 0 6px;
    background: var(--voile); backdrop-filter: blur(4px); color: var(--encre);
    transition: right .25s ease; }
  body.panneau-reduit #togglePanneau { right: 0; border-radius: 6px 0 0 6px; }
  #panneau h2 { margin: 0 0 2px; font-size: 17px; }
  #panneau .schema { font-size: 12px; opacity: .7; margin-bottom: 8px; }
  #panneau .comm { font-style: italic; opacity: .8; margin: 6px 0 10px; }
  #panneau table { border-collapse: collapse; width: 100%; font-size: 13px; }
  #panneau td { padding: 3px 6px 3px 0; vertical-align: top; border-top: 1px solid var(--bord); }
  #panneau .ic { width: 22px; }
  #panneau .ty { opacity: .6; font-size: 12px; }
  #panneau .ccom { font-size: 11.5px; opacity: .65; font-style: italic; }
  #panneau a { color: var(--ligne-vive); cursor: pointer; text-decoration: none; }
  #panneau h4 { margin: 14px 0 4px; font-size: 13px; text-transform: uppercase;
    letter-spacing: .04em; opacity: .7; }
  #panneau .vide { opacity: .6; font-style: italic; margin-top: 3em; }
  #legende { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 6px;
    flex-wrap: wrap; z-index: 10; max-width: 55%; }
  /* which mcdview built this page — a discreet signature in the detail panel's
     bottom-right corner, so a saved diagram is traceable to a version (the site
     never regenerates old pages). Rides with the panel: hidden while collapsed
     (the default), shown when the panel is open or during its intro. */
  #version { position: fixed; right: 14px; bottom: 10px; z-index: 11; font-size: 11px;
    color: var(--encre); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
  body:not(.panneau-reduit) #version, body.intro-panneau #version { opacity: .3; }
  #legende .puce { display: flex; gap: 6px; align-items: center; font: inherit;
    background: var(--voile); color: var(--encre); border: 1px solid var(--bord);
    border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer;
    backdrop-filter: blur(4px); }
  #legende .puce .pt { width: 10px; height: 10px; border-radius: 50%;
    border: 1px solid #0002; }
  #legende .puce .nb { opacity: .6; }
  /* attribution badge as a slanted rubber stamp, fixed bottom-right inside the
     diagram area (the detail panel is 340px wide on the right); empty unless
     --credit is given. Muted ink so it reads on light and dark themes */
  #credit { position: fixed; bottom: 22px; right: 366px; z-index: 10;
    --encre-tampon: #c0261b; transform: rotate(-7deg); }
  @media (prefers-color-scheme: dark) { #credit { --encre-tampon: #e5675c; } }
  #credit:empty { display: none; }
  #credit > a, #credit > span { color: var(--encre-tampon); text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px; font-size: 11px;
    font-weight: 700; text-transform: uppercase; letter-spacing: .12em;
    border: 2px solid var(--encre-tampon); border-radius: 4px;
    padding: 3px 9px 3px 7px; opacity: .6; }
  #credit img { opacity: .85; }
  #credit > a:hover { opacity: .9; }
  path.lien { stroke: var(--ligne); stroke-width: 1.2; fill: none; opacity: .5; }
  path.lien.vif { stroke: var(--ligne-vive); stroke-width: 2; opacity: 1; }
</style>
</head>
<body class="panneau-reduit">
<div id="hud">
  <span style='display:flex;align-items:center'>__LOGO__</span>
  <strong>__TITRE__</strong>
  <input id="cherche" type="search" placeholder="chercher table ou colonne…" list="noms">
  <datalist id="noms"></datalist>
  <button id="vueGenerale" hidden>← vue générale (Échap)</button>
  <button id="reorganiser" title="réétaler les tables pour dégager les liens">⇄ réorganiser</button>
  <button id="btnHubs" data-graphe title="teinter les tables par nombre de relations">◉ hubs</button>
  <button id="btnCycles" data-graphe title="surligner les cycles de clés étrangères">↻ cycles</button>
  <button id="btnJointure" data-graphe title="chemin de jointure entre deux tables">⇢ jointure</button>
  <button id="btnStats" title="résumé du modèle">∑ résumé</button>
  <button id="theme" title="thème clair / sombre">◐</button>
  <details id="menuExport" class="menu">
    <summary title="exporter : SVG, Markdown, DOT">⬇ export</summary>
    <div class="menu-liste">
      <button id="exportSvg">SVG</button>
      <button id="exportDico">Markdown</button>
      <button id="exportDot">DOT (Graphviz)</button>
    </div>
  </details>
  <button id="btnFkManq" title="colonnes _id sans clé étrangère déclarée">≈ FK ?</button>
  <label id="labelAudit"><input type="checkbox" id="voirAudit"> FK d'audit</label>
  <span id="compte"></span>
</div>
<div id="viewport">
  <div id="plan"><svg id="liens" class="avant-refit"></svg></div>
</div>
<canvas id="minimap" width="200" height="140" title="cliquer pour naviguer"></canvas>
<div id="legende"></div>
<div id="version">__VERSION__</div>
<div id="legdiff"><span class="add">ajoutée</span><span class="mod">modifiée</span><span class="del">supprimée</span><button id="filtreTouchees" type="button"></button></div>
<div id="credit">__CREDIT__</div>
<div id="indice" hidden></div>
<button id="togglePanneau" type="button" title="réduire / agrandir le panneau">›</button>
<div id="panneau"><p class="vide">Cliquer sur une table pour l'isoler avec ses
tables liées et voir son détail ici.<br><br>Molette : zoom.
Glisser : déplacer. Échap : vue générale.</p></div>
<script>
"use strict";
const D = __DONNEES__;
const plan = document.getElementById("plan");
const vp = document.getElementById("viewport");
const svg = document.getElementById("liens");
const panneau = document.getElementById("panneau");
const btnRetour = document.getElementById("vueGenerale");
const ckAudit = document.getElementById("voirAudit");
const parCle = {}, elems = {}, origines = {};
let focusCle = null, survolCle = null, x = 0, y = 0, k = 1;
let filtreTouchees = false;  // diff: show only added/removed/changed tables
let mev = null;   // graph highlight {tables:Set, liens:Set} — cycles/impact/join
let vuePrise = false;  // the viewer panned/zoomed: stop auto-refitting the view

D.tables.forEach(t => { parCle[t.schema + "." + t.nom] = t; });

// injected model strings (names, types, comments) must never become markup
function ech(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
document.getElementById("compte").textContent =
  D.tables.length + " tables · " + D.fks.length + " FK" +
  (D.dialecte && D.dialecte !== "postgresql" ? " · " + D.dialecte : "");

function fksVisibles() {
  return D.fks.filter(f => ckAudit.checked || !f.audit);
}
function voisins(cle) {
  const s = new Set();
  fksVisibles().forEach(f => {
    if (f.de === cle) s.add(f.vers);
    if (f.vers === cle) s.add(f.de);
  });
  s.delete(cle);
  return [...s];
}

// --- table construction ---
const dl = document.getElementById("noms");
// single fragment append: one layout instead of thousands on big models
const fragTables = document.createDocumentFragment();
const fragNoms = document.createDocumentFragment();
const parColonne = {};      // "table.col" and bare "col" -> {cle, col} for search
let colonneCible = null;    // a column to highlight after the search isolates its table
const colonnesEnAuto = D.tables.length <= 300;  // suggest columns only on small models
const NOEUDS_LEGERS = D.tables.length > 800;    // header-only nodes on huge models
const fkColsPar = {};
D.fks.forEach(f => { (fkColsPar[f.de] = fkColsPar[f.de] || new Set()).add(f.col); });
const DCLS = { ajoute: "d-add", supprime: "d-del", modifie: "d-mod" };
const tParCle = {};              // cle -> table data, for lazy node rebuilds
// node markup: header always, column <ul> only when avecColonnes. On a huge
// model the overview builds header-only nodes (≈20× fewer DOM nodes); isoler()
// re-injects the columns for the handful of tables it keeps on screen, so the
// isolated table reads like it does on a small model.
function htmlNoeud(cle, avecColonnes) {
  const t = tParCle[cle];
  const entete = "<h3 style='background:" + ech(D.schemas[t.schema] || "#ccc") + "'>" + ech(t.nom) + "</h3>";
  if (!avecColonnes) return entete;
  const fkCols = fkColsPar[cle] || new Set();
  return entete + "<ul>" +
    t.cols.map(c => "<li" + (c.diff ? " class='" + DCLS[c.diff] + "'" : "") + ">" +
      (t.pk.includes(c.nom) ? "🔑 " : fkCols.has(c.nom) ? "🔗 " : "") +
      ech(c.nom) + "<span class='t'>" + ech(c.type) + "</span></li>").join("") + "</ul>";
}
D.tables.forEach(t => {
  const cle = t.schema + "." + t.nom;
  tParCle[cle] = t;
  const div = document.createElement("div");
  div.className = "table" + (t.diff ? " " + DCLS[t.diff] : "");
  div.style.left = t.x + "px";
  div.style.top = t.y + "px";
  div.innerHTML = htmlNoeud(cle, !NOEUDS_LEGERS);
  if (t.comment) div.title = t.comment;
  div.dataset.cle = cle;
  fragTables.appendChild(div);
  elems[cle] = div;
  const o = document.createElement("option");
  o.value = cle;
  fragNoms.appendChild(o);
  t.cols.forEach(c => {
    // the index (typed "table.col" or a bare column name resolves to a table)
    // stays cheap for any size; the datalist <option> per column would be a
    // ×10 node blow-up on a big model, so only suggest columns on small ones
    parColonne[(t.nom + "." + c.nom).toLowerCase()] = { cle, col: c.nom };
    const seul = c.nom.toLowerCase();
    if (!(seul in parColonne)) parColonne[seul] = { cle, col: c.nom };
    if (colonnesEnAuto) {
      const oc = document.createElement("option");
      oc.value = t.nom + "." + c.nom;
      fragNoms.appendChild(oc);
    }
  });
});
plan.appendChild(fragTables);
dl.appendChild(fragNoms);
if (D.diff) {
  const leg = document.getElementById("legdiff");
  leg.classList.add("on");
  const cpt = { ajoute: 0, supprime: 0, modifie: 0 };
  D.tables.forEach(t => { if (t.diff) cpt[t.diff]++; });
  leg.querySelector(".add").insertAdjacentHTML("beforeend", "<b>" + cpt.ajoute + "</b>");
  leg.querySelector(".mod").insertAdjacentHTML("beforeend", "<b>" + cpt.modifie + "</b>");
  leg.querySelector(".del").insertAdjacentHTML("beforeend", "<b>" + cpt.supprime + "</b>");
  const MOT = "touchées";
  const btnFiltre = document.getElementById("filtreTouchees");

function cadrer(cles) {

// --- DBeaver-like focus mode: the table in the center, its neighbours in a star ---
const enrichis = new Set();   // huge-model nodes rebuilt with their columns (see isoler)
function isoler(cle) {
  sortirModes();  // drilling into a table drops any graph highlight / join mode
  if (document.body.classList.contains("hubs")) {  // heatmap is an overview overlay
    document.body.classList.remove("hubs");
    document.getElementById("btnHubs").classList.remove("actif");
  }
  focusCle = cle;
  finIntro();  // a table click ends the intro and keeps the panel open below
  if (autoExpand && panneauReduit) reduirePanneau(false, true);  // reveal detail
  survolCle = null;
  history.replaceState(null, "", "#" + encodeURIComponent(cle));
  btnRetour.hidden = false;
  const voisinage = voisins(cle);
  const garde = new Set([cle, ...voisinage]);
  Object.keys(elems).forEach(c => elems[c].classList.toggle("efface", !garde.has(c)));
  Object.keys(elems).forEach(c => elems[c].classList.toggle("choisie", c === cle));
  // huge model: the kept tables were built header-only; give them their columns
  // back now (cheap for a star of a few tables) so the isolated view is legible.
  // Done before measuring sizes below, so the star layout uses the real heights.
  if (NOEUDS_LEGERS) garde.forEach(c => {
    if (!enrichis.has(c)) { elems[c].innerHTML = htmlNoeud(c, true); enrichis.add(c); }
  });
  // star: the chosen table keeps its place, neighbours circle around it.
  // The radius grows with the table sizes (a big neighbour like a 40-column
  // table would overlap the centre at a fixed radius) and a final de-overlap
  // pass, centre kept fixed, guarantees nothing touches.
  const c0 = centre(cle);
  const til = c => { const e = elems[c]; return Math.hypot(e.offsetWidth, e.offsetHeight) / 2; };
  const rC = til(cle);
  let rMax = 0, somme = 0;
  voisinage.forEach(v => { const t = til(v); rMax = Math.max(rMax, t); somme += t; });
  const rayon = Math.max(360, rC + rMax + 90, somme / Math.PI + rMax);
  const P = { [cle]: { x: c0.x, y: c0.y, r: rC } };
  voisinage.forEach((v, i) => {
    const a = -Math.PI / 2 + (2 * Math.PI * i) / voisinage.length;
    P[v] = { x: c0.x + rayon * Math.cos(a), y: c0.y + rayon * Math.sin(a), r: til(v) };
  });
  const noeuds = [cle, ...voisinage];
  for (let passe = 0; passe < 40; passe++) {
    let colle = false;
    for (let i = 0; i < noeuds.length; i++) {
      for (let j = i + 1; j < noeuds.length; j++) {
        const A = P[noeuds[i]], B = P[noeuds[j]];
        let ex = A.x - B.x, ey = A.y - B.y;
        const d = Math.hypot(ex, ey) || 0.01;
        const dmin = A.r + B.r + 30;
        if (d < dmin) {

          if (noeuds[i] === cle) { B.x -= ex * pousse; B.y -= ey * pousse; }
          else if (noeuds[j] === cle) { A.x += ex * pousse; A.y += ey * pousse; }
          else { A.x += ex * pousse / 2; A.y += ey * pousse / 2; B.x -= ex * pousse / 2; B.y -= ey * pousse / 2; }
          colle = true;
        }
      }
    }
    if (!colle) break;
  }
  voisinage.forEach(v => {
    const e = elems[v];
    e.style.left = Math.round(P[v].x - e.offsetWidth / 2) + "px";
    e.style.top = Math.round(P[v].y - e.offsetHeight / 2) + "px";
  });

  setTimeout(() => { dessinerLiens(); cadrer([...garde]); }, 380);
  svg.innerHTML = "";
}

  if (bf) bf.classList.remove("actif");

// --- force-directed relayout: spread tables so FK links overlap less ---
// Fruchterman-Reingold on table centers; node size is folded into the ideal
// distance so big tables push each other apart. One-shot on the button.
const btnReorg = document.getElementById("reorganiser");
const REORG_MAX = 400;  // above this, O(n²) freezes the tab: disable the button
if (D.tables.length > REORG_MAX) {
  btnReorg.disabled = true;
  btnReorg.title = "trop de tables pour réorganiser (" + D.tables.length + ")";
}
function reorganiser() {
  const cles = Object.keys(elems).filter(c => !elems[c].classList.contains("efface"));
  const n = cles.length;
  if (n < 2 || n > REORG_MAX) return;
  btnReorg.disabled = true;
  const idx = {}, taille = {};
  const px = new Float64Array(n), py = new Float64Array(n);
  cles.forEach((c, i) => {
    idx[c] = i;
    const e = elems[c];
    px[i] = e.offsetLeft + e.offsetWidth / 2;
    py[i] = e.offsetTop + e.offsetHeight / 2;
    taille[i] = Math.hypot(e.offsetWidth, e.offsetHeight) / 2;
  });
  const aretes = fksVisibles()
    .filter(f => idx[f.de] !== undefined && idx[f.vers] !== undefined && f.de !== f.vers)
    .map(f => [idx[f.de], idx[f.vers]]);
  const surface = n * 90000;
  const k = Math.sqrt(surface / n);               // ideal edge length
  const iters = Math.max(60, Math.min(300, Math.round(6000 / Math.sqrt(n))));
  let temp = k * 1.2;                             // cooling: max move per step
  // gravity target: pull every table gently toward the centroid so weakly
  // linked ones don't drift off and blow up the frame
  let cx = 0, cy = 0;

  for (let it = 0; it < iters; it++) {
    dx.fill(0); dy.fill(0);

        let ex = px[i] - px[j], ey = py[i] - py[j];
        let d = Math.hypot(ex, ey) || 0.01;
        // bounded range: far pairs don't repel, so gravity can reel in
        // isolated tables instead of letting them drift off
        if (d > 5 * k) continue;
        const dmin = taille[i] + taille[j] + 40;
        // stronger push while boxes would overlap, normal 1/d repulsion else
        const rep = (k * k / d) * (d < dmin ? 3 : 1);
        ex /= d; ey /= d;
        dx[i] += ex * rep; dy[i] += ey * rep;
        dx[j] -= ex * rep; dy[j] -= ey * rep;
      }
    }
    for (const [a, b] of aretes) {
      let ex = px[a] - px[b], ey = py[a] - py[b];
      const d = Math.hypot(ex, ey) || 0.01;
      // ideal edge length grows with the two boxes so wide linked tables are
      // not pulled into each other (a constant k overlaps big tables)
      const lg = Math.max(k, taille[a] + taille[b] + 60);
      const att = d * d / lg;
      ex = ex / d * att; ey = ey / d * att;
      dx[a] -= ex; dy[a] -= ey;
      dx[b] += ex; dy[b] += ey;
    }
    for (let i = 0; i < n; i++) {
      dx[i] += (cx - px[i]) * 0.06; dy[i] += (cy - py[i]) * 0.06;
      const d = Math.hypot(dx[i], dy[i]) || 0.01;
      px[i] += dx[i] / d * Math.min(d, temp);
      py[i] += dy[i] / d * Math.min(d, temp);
    }
    temp = Math.max(k * 0.05, temp * 0.96);       // simulated annealing
  }

  // so the layout ends with zero visible overlap whatever the forces settled on
  for (let passe = 0; passe < 24; passe++) {
    let colle = false;
    for (let i = 0; i < n; i++) {
      for (let j = i + 1; j < n; j++) {
        let ex = px[i] - px[j], ey = py[i] - py[j];
        const d = Math.hypot(ex, ey) || 0.01;
        const dmin = taille[i] + taille[j] + 40;
        if (d < dmin) {
          const pousse = (dmin - d) / 2;
          ex /= d; ey /= d;
          px[i] += ex * pousse; py[i] += ey * pousse;
          px[j] -= ex * pousse; py[j] -= ey * pousse;
          colle = true;
        }
      }
    }
    if (!colle) break;
  }
  cles.forEach(c => {
    const e = elems[c], i = idx[c];
    e.style.left = Math.round(px[i] - e.offsetWidth / 2) + "px";
    e.style.top = Math.round(py[i] - e.offsetHeight / 2) + "px";
    if (!focusCle) origines[c] = { x: e.offsetLeft, y: e.offsetTop };
  });
  if (!focusCle) sauverPositions();
  // the tables glide to their new spot over the .35s CSS transition; redraw
  // the links every frame so they follow instead of snapping at the end
  const t0 = performance.now();
  (function suivre() {
    dessinerLiens();
    if (performance.now() - t0 < 380) requestAnimationFrame(suivre);
    else { cadrer(cles); btnReorg.disabled = D.tables.length > REORG_MAX; }
  })();
}

// --- export the visible diagram as a portable SVG (native shapes + text, no
// dependency; the page is the user's own file, so a blob download works) ---
function exporterSVG() {
  const pad = 24, vis = Object.keys(elems).filter(c => !elems[c].classList.contains("efface"));
  if (!vis.length) return;
  // The export always draws every column, but a zoomed-out (compact) page
  // collapses each node to its header, which would size the boxes and anchor the
  // FK links to the header alone. Drop compact for the measurement (synchronous,
  // restored before we return, so no flicker) so the DOM reflows to full detail.
  const etaitCompact = plan.classList.contains("compact");
  if (etaitCompact) plan.classList.remove("compact");
  try {
    exporterSVGImpl(pad, vis);
  } finally {
    if (etaitCompact) plan.classList.add("compact");
  }
}
function exporterSVGImpl(pad, vis) {
  let bx0 = 1e9, by0 = 1e9, bx1 = -1e9, by1 = -1e9;
  vis.forEach(c => {
    const e = elems[c];
    bx0 = Math.min(bx0, e.offsetLeft); by0 = Math.min(by0, e.offsetTop);
    bx1 = Math.max(bx1, e.offsetLeft + e.offsetWidth);
    by1 = Math.max(by1, e.offsetTop + e.offsetHeight);
  });
  const W = Math.round(bx1 - bx0 + 2 * pad), H = Math.round(by1 - by0 + 2 * pad);
  const ox = pad - bx0, oy = pad - by0, visSet = new Set(vis), p = [];
  p.push(`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" ` +
    `viewBox="0 0 ${W} ${H}" font-family="ui-sans-serif,system-ui,sans-serif">`);
  p.push(`<rect width="${W}" height="${H}" fill="#f4f4f6"/>`);
  fksVisibles().forEach(f => {
    if (!visSet.has(f.de) || !visSet.has(f.vers)) return;
    const a = centre(f.de), b = centre(f.vers);
    const ax = a.x + ox, ay = a.y + oy, bx = b.x + ox, by = b.y + oy, mx = (ax + bx) / 2;
    p.push(`<path d="M ${ax} ${ay} C ${mx} ${ay}, ${mx} ${by}, ${bx} ${by}" ` +
      `fill="none" stroke="#9aa3ad" stroke-width="1.2"/>`);
  });
  vis.forEach(c => {
    const e = elems[c], t = parCle[c], w = e.offsetWidth;
    const X = Math.round(e.offsetLeft + ox), Y = Math.round(e.offsetTop + oy);
    const fkc = fkColsPar[c] || new Set();
    p.push(`<g transform="translate(${X} ${Y})">`);
    p.push(`<rect width="${w}" height="${e.offsetHeight}" rx="6" fill="#ffffff" stroke="#d5d8dd"/>`);
    p.push(`<path d="M0 6 a6 6 0 0 1 6 -6 h${w - 12} a6 6 0 0 1 6 6 v20 h-${w} z" ` +
      `fill="${ech(D.schemas[t.schema] || '#ccc')}"/>`);
    p.push(`<text x="9" y="17" font-weight="bold" font-size="13" fill="#1c1e22">${ech(t.nom)}</text>`);
    t.cols.forEach((col, i) => {
      const mk = t.pk.includes(col.nom) ? "🔑 " : fkc.has(col.nom) ? "🔗 " : "";
      p.push(`<text x="10" y="${42 + i * 20.5}" font-size="12.5" fill="#1c1e22">` +
        `${ech(mk + col.nom)}<tspan fill="#8b93a0" font-size="11"> ${ech(col.type)}</tspan></text>`);
    });
    p.push(`</g>`);
  });
  p.push(`</svg>`);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([p.join("")], { type: "image/svg+xml" }));
  a.download = (document.title.replace(/[^\w.-]+/g, "_") || "mcdview") + ".svg";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// --- probable missing FKs: an <x>_id column with no declared FK, when a table
// named <x> (or its simple plural/singular) exists. A heuristic hint, not a
// certainty — presented as a list, with the involved tables highlighted. ---
function fkManquantes() {
  const noms = {};
  Object.keys(parCle).forEach(c => { noms[c.split(".").pop().toLowerCase()] = c; });
  const dejaFk = new Set();
  fksVisibles().forEach(f => dejaFk.add(f.de + "|" + f.col));
  const sugg = [];
  Object.keys(parCle).forEach(cle => {
    parCle[cle].cols.forEach(col => {
      if (dejaFk.has(cle + "|" + col.nom)) return;
      const m = col.nom.toLowerCase().match(/^(.*[a-z])_?id$/);
      if (!m) return;
      const base = m[1];
      const cand = noms[base] || noms[base + "s"] || noms[base.replace(/s$/, "")] ||
                   noms[base.replace(/y$/, "ies")];
      if (cand && cand !== cle) sugg.push({ de: cle, col: col.nom, vers: cand });
    });
  });
  return sugg;
}

// ---- transitive reachable set (impact analysis) ----
// amont = the tables this one depends on (follow outgoing FKs); aval = the
// tables that depend on this one (follow incoming FKs). Returns {tables, liens}.
function atteignable(depart, versLAmont) {
  const vus = new Set([depart]), liens = new Set(), file = [depart];
  while (file.length) {
    const cur = file.shift();
    (versLAmont ? fkSortantes(cur) : fkEntrantes(cur)).forEach(f => {
      liens.add(cleLien(f.de, f.vers));
      const suiv = versLAmont ? f.vers : f.de;
      if (!vus.has(suiv)) { vus.add(suiv); file.push(suiv); }
    });
  }
  return { tables: vus, liens };
}
function montrerImpact(cle, versLAmont) {
  const r = atteignable(cle, versLAmont);
  if (r.tables.size <= 1) { montrerIndice(TXT.aucuneRelation); return; }
  // called from the isolated panel: leave isolation so the whole reachable set
  // is visible (home positions), then highlight it. Keep the panel as-is.
  reinitVue();
  poserMev(r.tables, r.liens);
  elems[cle].classList.add("depart");
  cadrer([...r.tables]);
}

// ---- enriched search: fuzzy names, type:… and ref:… ----
function cleFloue(vl) {  // subsequence match on the short name; shortest name wins
  let best = null, bestLen = 1e9;
  Object.keys(parCle).forEach(c => {
    const nom = c.split(".").pop().toLowerCase();
    let i = 0; for (const ch of nom) if (i < vl.length && ch === vl[i]) i++;
    if (i === vl.length && nom.length < bestLen) { best = c; bestLen = nom.length; }
  });
  return best;
}
function chercherType(q) {  // highlight every table with a column of this type
  const tables = Object.keys(parCle).filter(c =>
    parCle[c].cols.some(col => col.type.toLowerCase().includes(q)));
  if (!tables.length) { montrerIndice(TXT.rienTrouve); return; }
  reinitVue(); poserMev(tables, new Set()); cadrer(tables);
  montrerIndice(tables.length + " " + TXT.tablesAvecType + ' « ' + q + ' »');
}
function chercherRef(q) {  // highlight the tables that reference the named table
  const cible = Object.keys(parCle).find(c => c.split(".").pop().toLowerCase() === q)
             || Object.keys(parCle).find(c => c.toLowerCase().includes(q));
  if (!cible) { montrerIndice(TXT.rienTrouve); return; }
  const liens = new Set(), tables = new Set([cible]);
  fksVisibles().forEach(f => {
    if (f.vers === cible) { tables.add(f.de); liens.add(cleLien(f.de, f.vers)); }
  });
  reinitVue(); poserMev(tables, liens);
  elems[cible] && elems[cible].classList.add("depart");
  cadrer([...tables]);
  montrerIndice((tables.size - 1) + " " + TXT.tablesRef + " " + nomCourt(cible));
}

// ---- shortest join path between two tables (BFS on the undirected FK graph) ----
function cheminEntre(a, b) {
  if (a === b) return [a];
  const prec = { [a]: null }, file = [a];
  while (file.length) {
    const cur = file.shift();
    if (cur === b) break;
    voisins(cur).forEach(v => { if (!(v in prec)) { prec[v] = cur; file.push(v); } });
  }
  if (!(b in prec)) return null;
  const chemin = []; let n = b;
  while (n !== null) { chemin.unshift(n); n = prec[n]; }
  return chemin;
}
function nomCourt(cle) { return cle.split(".").slice(1).join("."); }
function sqlDuChemin(chemin) {
  // SELECT * FROM t0 JOIN t1 ON t1.fk = t0.pk … for each step, using whichever
  // FK connects the pair and in whichever direction it points
  const lignes = ["SELECT *", "FROM " + nomCourt(chemin[0])];
  for (let i = 1; i < chemin.length; i++) {
    const prev = chemin[i - 1], cur = chemin[i], f = arcEntre(prev, cur);
    let cond = "/* no FK found */";
    if (f) {
      cond = f.de === prev
        ? `${nomCourt(prev)}.${f.col} = ${nomCourt(cur)}.${f.colcible || "?"}`
        : `${nomCourt(cur)}.${f.col} = ${nomCourt(prev)}.${f.colcible || "?"}`;
    }
    lignes.push(`JOIN ${nomCourt(cur)} ON ${cond}`);
  }
  return lignes.join("\n") + ";";
}
const jointure = { actif: false, premier: null };
function montrerJointure(a, b) {
  const chemin = cheminEntre(a, b);
  if (!chemin) {  // disconnected: still name both ends
    poserMev([a, b], new Set());
    afficherEncartJointure(a, b, null);
    return;
  }
  const liens = new Set();
  for (let i = 1; i < chemin.length; i++) {
    const f = arcEntre(chemin[i - 1], chemin[i]);
    if (f) liens.add(cleLien(f.de, f.vers));
  }
  poserMev(chemin, liens);
  elems[a].classList.add("depart"); elems[b].classList.add("arrivee");
  cadrer(chemin);
  afficherEncartJointure(a, b, chemin);
}

// ---- FK cycles: tables that sit on a circular dependency (Tarjan SCC) ----
function tablesEnCycle() {
  const adj = {}, boucleSoi = new Set();
  Object.keys(parCle).forEach(c => { adj[c] = []; });
  fksVisibles().forEach(f => {
    if (f.de === f.vers) boucleSoi.add(f.de);
    else if (adj[f.de]) adj[f.de].push(f.vers);
  });
  // iterative Tarjan (deep chains would overflow a recursive one)
  let idx = 0; const num = {}, bas = {}, pile = [], surPile = new Set(), dans = new Set();
  Object.keys(adj).forEach(depart => {
    if (num[depart] !== undefined) return;
    const trav = [[depart, 0]];
    while (trav.length) {
      const cadre = trav[trav.length - 1], v = cadre[0];
      if (cadre[1] === 0) { num[v] = bas[v] = idx++; pile.push(v); surPile.add(v); }
      if (cadre[1] < adj[v].length) {
        const w = adj[v][cadre[1]++];
        if (num[w] === undefined) trav.push([w, 0]);
        else if (surPile.has(w)) bas[v] = Math.min(bas[v], num[w]);
      } else {
        if (bas[v] === num[v]) {
          const comp = []; let w;
          do { w = pile.pop(); surPile.delete(w); comp.push(w); } while (w !== v);
          if (comp.length > 1) comp.forEach(x => dans.add(x));
        }
        trav.pop();
        if (trav.length) { const p = trav[trav.length - 1][0]; bas[p] = Math.min(bas[p], bas[v]); }
      }
    }
  });
  boucleSoi.forEach(x => dans.add(x));
  return dans;
}
function basculerCycles() {
  const btn = document.getElementById("btnCycles");
  if (btn.classList.contains("actif")) { btn.classList.remove("actif"); sortirModes(); return; }
  sortirModes();
  const dans = tablesEnCycle();
  if (!dans.size) { montrerIndice(TXT.aucunCycle); return; }
  const liens = new Set();
  fksVisibles().forEach(f => { if (dans.has(f.de) && dans.has(f.vers)) liens.add(cleLien(f.de, f.vers)); });
  poserMev(dans, liens);
  btn.classList.add("actif");
  cadrer([...dans]);
}

// ---- hub heatmap: shade each table by its FK degree ----
const degre = {};
Object.keys(parCle).forEach(c => { degre[c] = 0; });
D.fks.forEach(f => { if (degre[f.de] !== undefined) degre[f.de]++; if (degre[f.vers] !== undefined) degre[f.vers]++; });
const degreMax = Math.max(1, ...Object.values(degre));
function basculerHubs() {
  const btn = document.getElementById("btnHubs");
  const on = !document.body.classList.contains("hubs");
  document.body.classList.toggle("hubs", on);
  btn.classList.toggle("actif", on);
  if (on) Object.keys(elems).forEach(c => {
    elems[c].style.setProperty("--deg", (degre[c] / degreMax).toFixed(3));
    let b = elems[c].querySelector(".deg");
    if (!b) { b = document.createElement("span"); b.className = "deg";
              elems[c].querySelector("h3").appendChild(b); }
    b.textContent = degre[c];
  });
}
document.getElementById("btnHubs").addEventListener("click", basculerHubs);
document.getElementById("btnCycles").addEventListener("click", basculerCycles);
document.getElementById("btnJointure").addEventListener("click", () => {
  const btn = document.getElementById("btnJointure");
  if (jointure.actif) { btn.classList.remove("actif"); sortirModes(); return; }
  sortirModes(); vueGenerale();
  jointure.actif = true; jointure.premier = null;
  btn.classList.add("actif");
  montrerIndice(TXT.choisirPremiere, true);
});

if (!D.fks.some(f => f.audit)) document.getElementById("labelAudit").hidden = true;
dessinerLiens();
cadrer(Object.keys(elems));
// Firefox computes the first fit before layout/fonts settle, so the initial
// zoom and edge routing are off until a reflow (the first hover fixes it).
// Re-fit once fonts are ready and two frames have painted — a no-op in Chrome
// (same result), the correction Firefox needs. Skipped if the viewer is
// already on a specific table (permalink) or has taken over the view.
let liensReveles = false;
function revelerLiens() {  // idempotent: edges fade in once, whoever gets here first
  if (liensReveles) return;
  liensReveles = true;
  svg.classList.remove("avant-refit");
}
function refitInitial() {
  // if a permalink put the viewer on a table, or the viewer already took over
  // the view (panned/zoomed), just redraw links against the now-settled boxes;
  // otherwise re-fit the whole diagram
  if (focusCle || location.hash || vuePrise) dessinerLiens();
  else { cadrer(Object.keys(elems)); dessinerLiens(); }
  revelerLiens();  // edges are now correctly placed against settled boxes
}
const deuxFrames = () => requestAnimationFrame(() => requestAnimationFrame(refitInitial));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(deuxFrames);
else deuxFrames();
// a settled layout is the reliable moment for the fit; window "load" fires after
// fonts and images, and re-fits even when fonts.ready/rAF misbehaved (Firefox)
window.addEventListener("load", () => { if (!vuePrise) refitInitial(); });
// safety net: if the frame is starved (background tab) or fonts.ready stalls,
// still re-fit AND reveal — never reveal edges at their provisional positions
setTimeout(() => { if (!liensReveles) refitInitial(); }, 1200);

// --- permalink: #schema.table opens straight on that table ---
window.addEventListener("hashchange", () => {
  const cle = decodeURIComponent(location.hash.slice(1));
  if (parCle[cle] && cle !== focusCle) isoler(cle);
  else if (!cle && focusCle) vueGenerale();
});
const cleInitiale = decodeURIComponent(location.hash.slice(1));
if (parCle[cleInitiale]) setTimeout(() => isoler(cleInitiale), 60);

// --- view deep-links: ?focus=<table>&theme=dark&audit=show&hubs&cycles ---
// the hosting side passes the query string straight to the page; theme is
// handled in initTheme, the rest here. Read-only, no network.
(function paramsVue() {
  const q = new URLSearchParams(location.search);
  if (q.get("audit") === "show" && !document.getElementById("labelAudit").hidden) {
    ckAudit.checked = true; ckAudit.dispatchEvent(new Event("change"));
  }
  const f = q.get("focus");
  if (f && !location.hash) {
    const cle = parCle[f] ? f :
      Object.keys(parCle).find(c => c.split(".").pop().toLowerCase() === f.toLowerCase());
    if (cle) setTimeout(() => isoler(cle), 80);
  }
  if (q.has("hubs")) setTimeout(basculerHubs, 130);
  if (q.has("cycles")) setTimeout(basculerCycles, 130);
})();
</script>
